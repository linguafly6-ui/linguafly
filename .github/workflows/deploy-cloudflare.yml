# Deploy Linguafly a Cloudflare Workers (OpenNext)
#
# Por defecto el deploy en push lo hace Cloudflare Workers Builds
# (Worker conectado al repo). Este workflow queda solo manual
# (workflow_dispatch) por si hace falta un redeploy desde GitHub Actions.
#
# Secrets opcionales (solo si usas este workflow):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Workers

on:
  # Los pushes a main los despliega Cloudflare Workers Builds (integración Git).
  # Mantener este workflow manual evita dos despliegues del mismo commit.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply Learning D1 migrations
        run: npx wrangler d1 migrations apply linguafly-learning --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: Sync source course JSON units into Learning D1
        run: |
          SEED_DIR=/tmp/d1-course-seed
          rm -rf "$SEED_DIR"
          mkdir -p "$SEED_DIR"
          npx tsx scripts/sync-course-json-to-d1.ts --sql-out-dir "$SEED_DIR"
          shopt -s nullglob
          files=("$SEED_DIR"/batch-*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Course JSON sync produced no SQL batches; refusing to continue."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Syncing Learning source $(basename "$f")"
            npx wrangler d1 execute linguafly-learning --remote --file="$f" --yes
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: Normalize B1-C2 course units into Learning D1
        run: |
          SEED_DIR=/tmp/d1-normalized-seed
          rm -rf "$SEED_DIR"
          mkdir -p "$SEED_DIR"
          npx tsx scripts/normalize-course-json-to-d1.ts --sql-out-dir "$SEED_DIR"
          shopt -s nullglob
          files=("$SEED_DIR"/batch-*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Normalized course import produced no SQL batches; refusing to continue."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Normalizing Learning data $(basename "$f")"
            npx wrangler d1 execute linguafly-learning --remote --file="$f" --yes
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: OpenNext build
        env:
          NEXT_PUBLIC_SITE_URL: https://linguafly.app
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: npm run cf:build

      - name: Verify OpenNext artifact
        # wrangler deploy needs .open-next/worker.js (wrangler.jsonc "main").
        # Fail here with a clear message if the OpenNext build did not produce it.
        run: |
          test -f .open-next/worker.js || {
            echo "::error::Missing .open-next/worker.js — the OpenNext build (npm run cf:build) did not generate it."
            exit 1
          }
          test -d .open-next/assets || {
            echo "::error::Missing .open-next/assets — the OpenNext build (npm run cf:build) did not generate it."
            exit 1
          }

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
