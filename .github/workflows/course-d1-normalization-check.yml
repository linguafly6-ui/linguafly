name: Course JSON to D1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/normalize-course-json-to-d1.ts"
      - "src/app/api/learning/lessons/**"
      - "migrations/d1/**"
      - ".github/workflows/course-d1-normalization-check.yml"
  push:
    branches: [feat/normalize-course-json-d1]
    paths:
      - "scripts/normalize-course-json-to-d1.ts"
      - "src/app/api/learning/lessons/**"
      - "migrations/d1/**"
      - ".github/workflows/course-d1-normalization-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate normalized SQL batches
        run: |
          SEED_DIR=/tmp/d1-normalized-seed
          npx tsx scripts/normalize-course-json-to-d1.ts --sql-out-dir "$SEED_DIR"
          test -n "$(find "$SEED_DIR" -maxdepth 1 -name 'batch-*.sql' -print -quit)"
          if grep -R -nE "undefined|NaN" "$SEED_DIR"; then
            echo "::error::Generated SQL contains a suspicious missing value."
            exit 1
          fi
          for section in grammar vocabulary listening reading production; do
            if ! grep -R -q "'$section'" "$SEED_DIR"; then
              echo "::error::Normalized course data is missing the required B1 section: $section"
              exit 1
            fi
          done
          if grep -R -n -- "--reset-test-progress" scripts/normalize-course-json-to-d1.ts .github/workflows/deploy-cloudflare.yml; then
            echo "::error::A destructive learner-progress reset must never run during deployment."
            exit 1
          fi
          echo "Generated $(find "$SEED_DIR" -maxdepth 1 -name 'batch-*.sql' | wc -l) SQL batches with all five B1 sections."
      - name: Type-check application
        run: npm run type-check
